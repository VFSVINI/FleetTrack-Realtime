name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Lint e testes (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolver dependências
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61

      - name: Testes (com detector de race)
        run: go test -race -count=1 ./...

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: docker compose --profile sim build
